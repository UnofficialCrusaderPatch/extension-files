disable-game-maps: رد کردن پوشهٔ maps/
disable-game-maps_descr: پوشهٔ maps/ بازی خوانده نمی‌شود. نقشه‌های همراه بازی بارگذاری نخواهند شد.
disable-user-maps: رد کردن پوشهٔ maps/ در پوشهٔ کاربر
disable-user-maps_descr: پوشهٔ maps/ کاربر خوانده نمی‌شود. نقشه‌های ذخیره‌شده در آن بارگذاری نخواهند شد.
