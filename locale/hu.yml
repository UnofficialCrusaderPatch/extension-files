disable-game-maps: A(z) maps/ mappa kihagyása
disable-game-maps_descr: Nem olvassa be a játék maps/ mappáját. A játékhoz mellékelt térképek nem töltődnek be.
disable-user-maps: A felhasználói könyvtár maps/ mappájának kihagyása
